[project]
name = "honcho-codex-lariat"
version = "0.5.0rc1"
description = "ChatGPT OAuth bridge from self-hosted Honcho to Codex"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Lariat contributors"}]
keywords = ["honcho", "codex", "chatgpt", "memory", "proxy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-codex==0.144.4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "mypy>=1.15,<2",
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
lariat = "honcho_codex_bridge.main:main"
honcho-codex-bridge = "honcho_codex_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honcho_codex_bridge", "src/lariat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["honcho_codex_bridge"]
strict = true
warn_unused_ignores = false

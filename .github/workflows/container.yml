name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: lariat:ci
      - name: Verify non-root and bundled Codex runtime
        run: |
          test "$(docker run --rm --entrypoint id lariat:ci -u)" != "0"
          docker run --rm --entrypoint python lariat:ci -c "from openai_codex import CodexConfig; assert CodexConfig().codex_bin is None"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lariat:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@v0
        with:
          image: lariat:ci
          format: spdx-json
          output-file: lariat.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: lariat-sbom
          path: lariat.spdx.json
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push private release-candidate image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker tag lariat:ci "ghcr.io/${GITHUB_REPOSITORY}:0.5.0-rc.1"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:0.5.0-rc.1"

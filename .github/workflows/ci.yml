name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: pip install -e '.[test]' pip-audit build
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: pip-audit --skip-editable
      - run: python -m build
      - run: docker compose config --quiet
        env:
          LARIAT_API_KEY: ci-placeholder-not-a-secret
